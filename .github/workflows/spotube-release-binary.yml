name: Fork Release Binary
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options:
          - stable
          - nightly
        default: nightly
        description: Release channel for the generated binaries
      debug:
        type: boolean
        default: false
        description: Open an SSH debug session if a nightly build fails
        required: false
      dry_run:
        type: boolean
        default: false
        description: Build artifacts only and skip the GitHub Release upload

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: 3.35.2
  FLUTTER_CHANNEL: master

permissions:
  contents: write

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION  }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Patch Flutter for Visual Studio 2026 runners
        shell: pwsh
        run: |
          $file = Join-Path $env:FLUTTER_ROOT 'packages/flutter_tools/lib/src/windows/visual_studio.dart'
          $content = Get-Content $file -Raw
          $updated = $content -replace "17 => 'Visual Studio 17 2022',", "18 => 'Visual Studio 18 2026',`n      17 => 'Visual Studio 17 2022',"
          if ($updated -ne $content) {
            Set-Content -Path $file -Value $updated
          }

      - name: Create CI .env
        shell: pwsh
        env:
          DOTENV_RELEASE_CONTENT: ${{ secrets.DOTENV_RELEASE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOTENV_RELEASE_CONTENT)) {
            @(
              'ENABLE_UPDATE_CHECK=1'
              'LASTFM_API_KEY='
              'LASTFM_API_SECRET='
              'RELEASE_CHANNEL=${{ inputs.channel }}'
              'HIDE_DONATIONS=0'
            ) | Set-Content -Path .env
          } else {
            $env:DOTENV_RELEASE_CONTENT | Set-Content -Path .env
          }

      # - name: free disk space
      #   if: ${{ matrix.platform == 'android' }}
      #   run: |
      #     sudo swapoff -a
      #     sudo rm -f /swapfile
      #     sudo apt clean
      #     docker rmi $(docker image ls -aq)
      #     df -h
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install windows dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=windows --arch=x86

      - name: Build windows binaries
        run: dart cli/cli.dart build --arch=x86 windows
        env:
          CHANNEL: ${{inputs.channel}}
          DOTENV: ${{secrets.DOTENV_RELEASE}}

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: windows-x86
          path: |
            dist/Spotube-windows-x86_64.nupkg
            dist/Spotube-windows-x86_64-setup.exe

      - name: Open SSH Debug Session On Failure
        if: ${{ failure() && inputs.debug && inputs.channel == 'nightly' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

  build_android:
    runs-on: ubuntu-22.04
    env:
      KEYSTORE_SECRET: ${{ secrets.KEYSTORE }}
      KEY_PROPERTIES_SECRET: ${{ secrets.KEY_PROPERTIES }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Android signing configuration
        id: android_signing
        shell: bash
        run: |
          if [[ -n "${KEYSTORE_SECRET}" && -n "${KEY_PROPERTIES_SECRET}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Android build when signing secrets are missing
        if: ${{ steps.android_signing.outputs.enabled != 'true' }}
        run: echo "Android signing secrets are not configured; skipping Android build."

      - name: Create CI .env
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          DOTENV_RELEASE_CONTENT: ${{ secrets.DOTENV_RELEASE }}
        run: |
          if [[ -n "${DOTENV_RELEASE_CONTENT}" ]]; then
            printf '%s\n' "${DOTENV_RELEASE_CONTENT}" > .env
          else
            printf '%s\n' \
              'ENABLE_UPDATE_CHECK=1' \
              'LASTFM_API_KEY=' \
              'LASTFM_API_SECRET=' \
              'RELEASE_CHANNEL=${{ inputs.channel }}' \
              'HIDE_DONATIONS=0' > .env
          fi

      - uses: subosito/flutter-action@v2.18.0
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION  }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Java
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true

      - name: Setup Rust toolchain
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install android dependencies
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=android --arch=all

      - name: Sign Android APK
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        run: |
          echo '${{ secrets.KEYSTORE }}' | base64 --decode > android/app/upload-keystore.jks
          echo '${{ secrets.KEY_PROPERTIES }}' > android/key.properties

      - name: Build android binaries
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        run: dart cli/cli.dart build --arch=all android
        env:
          CHANNEL: ${{inputs.channel}}
          DOTENV: ${{secrets.DOTENV_RELEASE}}

      - uses: actions/upload-artifact@v4
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        with:
          if-no-files-found: error
          name: android-all
          path: |
            build/Spotube-android-all-arch.apk

      - name: Open SSH Debug Session On Failure
        if: ${{ failure() && inputs.debug && inputs.channel == 'nightly' && steps.android_signing.outputs.enabled == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

  upload:
    runs-on: ubuntu-22.04
    needs:
      - build_windows
      - build_android
    if: ${{ always() && needs.build_windows.result == 'success' && needs.build_android.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./Spotube-Release-Binaries

      - name: Install dependencies
        run: sudo apt-get install tree -y

      - name: Generate Checksums
        run: |
          tree .
          find Spotube-Release-Binaries -type f -exec md5sum {} \; >> RELEASE.md5sum
          find Spotube-Release-Binaries -type f -exec sha256sum {} \; >> RELEASE.sha256sum
          sed -i 's|Spotube-Release-Binaries/.*/\([^/]*\)$|\1|' RELEASE.sha256sum RELEASE.md5sum
          sed -i 's|Spotube-Release-Binaries/||' RELEASE.sha256sum RELEASE.md5sum

      - name: Extract pubspec version
        run: |
          echo "PUBSPEC_VERSION=$(grep -oP 'version:\s*\K[^+]+(?=\+)' pubspec.yaml)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: sums
          path: |
            RELEASE.md5sum
            RELEASE.sha256sum

      - name: Upload Release Binaries (stable)
        if: ${{ !inputs.dry_run && inputs.channel == 'stable' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.PUBSPEC_VERSION }} # mind the "v" prefix
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          allowUpdates: true
          artifacts: Spotube-Release-Binaries/**/*,RELEASE.sha256sum,RELEASE.md5sum

      - name: Upload Release Binaries (nightly)
        if: ${{ !inputs.dry_run && inputs.channel == 'nightly' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          allowUpdates: true
          artifacts: Spotube-Release-Binaries/**/*,RELEASE.sha256sum,RELEASE.md5sum
          body: |
            Build Number: ${{github.run_number}}

            Nightly release includes newest features but may contain bugs
            It is preferred to use the stable version unless you know what you're doing

      - name: Open SSH Debug Session On Failure
        if: ${{ failure() && inputs.debug && inputs.channel == 'nightly' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
