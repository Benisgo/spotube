plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.plugin.compose"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveKeystore(String path) {
    if (path == null) return null
    def f = file(path)
    if (f.exists()) return f
    f = new File(rootProject.projectDir, path)
    if (f.exists()) return f
    f = new File(rootProject.projectDir.parentFile, path)
    return f.exists() ? f : null
}

def composeVersion = "1.4.8"

android {
    namespace "oss.krtirtho.spotube"
    
    compileSdkVersion 36

    ndkVersion = "29.0.14206865"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "$composeVersion" // Correlates with org.jetbrains.kotlin.android plugin in settings.gradle
    }

    defaultConfig {
        applicationId "oss.krtirtho.spotube"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        // NOTE: no ndk.abiFilters here — the Flutter Gradle plugin overrides
        // them anyway (FlutterPlugin.kt clears abiFilters and uses its own
        // DEFAULT_PLATFORMS list), and setting them breaks `--split-per-abi`
        // ("conflicting configuration"). Control ABIs via `--target-platform`
        // on the flutter build command instead (see cli/commands/build/android.dart).
    }

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? resolveKeystore(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Shrink Java/Kotlin bytecode and strip unused resources (R8).
            // proguard-rules.pro keeps reflection/JNI-heavy plugins working.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
        }
    }

    flavorDimensions "default"

    productFlavors {
        nightly {
            dimension "default"
            resValue "string", "app_name_en", "Spotube Nightly"
            applicationIdSuffix ".nightly"
            versionNameSuffix "-nightly"
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        dev {
            dimension "default"
            resValue "string", "app_name_en", "Spotube Dev"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        stable {
            dimension "default"
            resValue "string", "app_name_en", "Spotube"
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        resources.excludes += "DebugProbesKt.bin"
        doNotStrip "**/libpython.zip.so"
        // The flutter_new_pipe_extractor plugin's pubspec declares `assets: - assets/`,
        // so Flutter bundles its NewPipeCLI-windows-x64.zip into EVERY platform build.
        // It is only needed on Windows (Android uses the in-process extractor), so drop
        // it from the APK (~11 MB). resources.excludes filters packaged assets too.
        resources.excludes += "**/flutter_new_pipe_extractor/assets/NewPipeCLI-windows-x64.zip"
    }
}

flutter {
    source '../..'
}

def glanceVersion = "1.1.1"
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    // other deps so just ignore
    implementation 'com.android.support:multidex:2.0.1'

    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation "androidx.glance:glance-appwidget-preview:$glanceVersion"
    implementation "androidx.glance:glance-preview:$glanceVersion"
    implementation "androidx.glance:glance-material3:$glanceVersion"
    implementation "androidx.glance:glance-material:$glanceVersion"
    implementation "androidx.work:work-runtime-ktx:2.8.1"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
}
